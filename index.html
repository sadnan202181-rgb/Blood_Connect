<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Connect</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #fff1f2;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 30px 22px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 5px 20px #00000012;
    }

    .logo {
      font-size: 55px;
    }

    h1 {
      color: #dc2626;
      margin: 10px 0;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    h3 {
      color: #333;
      margin-bottom: 20px;
    }

    .option {
      display: block;
      width: 100%;
      padding: 20px;
      margin: 15px 0;
      border: 2px solid #fecaca;
      border-radius: 12px;
      background: white;
      color: #b91c1c;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }

    .option strong {
      display: block;
      font-size: 19px;
      margin-bottom: 8px;
    }

    .option span {
      color: #666;
      font-size: 14px;
    }

    .option:hover {
      background: #fee2e2;
    }

    footer {
      margin-top: 25px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🩸</div>

    <h1>Blood Connect</h1>

    <p class="subtitle">
      রক্ত দিন, জীবন বাঁচান
    </p>

    <h3>আপনি কোনটি?</h3>

    <!-- Donor Login Page -->
    <a href="donor-registration1.html"class="option">
      <strong>🩸 Blood Donor</strong>
      <span>আমি রক্ত দান করতে চাই</span>
    </a>

    <!-- Receiver Login Page -->
    <a href="receiver-login.html" class="option">
      <strong>❤️ Blood Receiver</strong>
      <span>আমার রক্ত প্রয়োজন</span>
    </a>

    <footer>
      Together We Save Lives
    </footer>

  </div>

</body>
</html>
